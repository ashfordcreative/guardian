# Ashford Guardian — release builder
#
# Push a tag like v2.0.1 and this workflow:
#   1. verifies the tag matches the version in ashford-guardian.php
#   2. builds a clean ashford-guardian.zip (repo files, minus dev files)
#   3. writes update-info.json for Plugin Update Checker (no GitHub API)
#   4. creates a GitHub Release with the zip + metadata attached
#
# Sites read update-info.json from:
#   https://github.com/ashfordcreative/guardian/releases/latest/download/update-info.json
#
# File location in the repo: .github/workflows/release.yml

name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches plugin version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION=$(grep -oP '^\s*\*\s*Version:\s*\K[0-9.]+' ashford-guardian.php)
          echo "Tag: $TAG_VERSION / Plugin header: $PLUGIN_VERSION"
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match the Version header in ashford-guardian.php ($PLUGIN_VERSION). Bump the header, commit, and re-tag."
            exit 1
          fi

      - name: Build zip and update metadata
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p build/ashford-guardian
          rsync -a ./ build/ashford-guardian \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "build" \
            --exclude "tests" \
            --exclude "RELEASING.md" \
            --exclude ".gitignore" \
            --exclude ".distignore"
          cd build
          zip -rq ashford-guardian.zip ashford-guardian
          unzip -l ashford-guardian.zip | head -20

          python3 - <<PY
          import json
          from datetime import datetime, timezone
          version = "${TAG_VERSION}"
          data = {
            "name": "Ashford Guardian",
            "slug": "ashford-guardian",
            "version": version,
            "download_url": f"https://github.com/ashfordcreative/guardian/releases/download/v{version}/ashford-guardian.zip",
            "homepage": "https://ashfordcreative.com",
            "requires": "6.0",
            "tested": "6.8",
            "requires_php": "7.4",
            "last_updated": datetime.now(timezone.utc).strftime("%Y-%m-%d"),
            "sections": {
              "description": "Self-contained smart auto-updates, with an optional Guardian Hub connection for fleet visibility."
            },
          }
          with open("update-info.json", "w", encoding="utf-8") as fh:
            json.dump(data, fh, indent=2)
            fh.write("\n")
          PY
          python3 -m json.tool update-info.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/ashford-guardian.zip
            build/update-info.json
          generate_release_notes: true
